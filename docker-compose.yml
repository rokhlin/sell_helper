services:
  sell_helper:
    image: ghcr.io/rokhlin/sell_helper:latest
    container_name: sell_helper
    restart: unless-stopped
    ports:
      - "3021:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=
      - AUTHORIZED_USERS=
      - GEMINI_API_KEY=
      - WEB_BASE_URL=${WEB_BASE_URL:-http://192.168.8.213:3021}
      - DATABASE_URL=file:/app/data/sell_helper.db
